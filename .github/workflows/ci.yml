name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Smoke test the CLI
        run: |
          node bin/cra-audit.js --version
          node bin/cra-audit.js sbom generate --cwd test/fixtures/pnpm

  action:
    name: GitHub Action (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fixture has an undocumented license, so the audit is expected to fail.
      - uses: ./
        id: cra
        continue-on-error: true
        with:
          working-directory: test/fixtures/demo-app
          upload-sarif: 'false'
          sbom: sbom.cdx.json
          vex: vex.cdx.json
          args: --no-sbom
      - name: Check the action outputs
        env:
          EXIT_CODE: ${{ steps.cra.outputs.exit-code }}
          SARIF: ${{ steps.cra.outputs.sarif }}
          SBOM: ${{ steps.cra.outputs.sbom }}
          VEX: ${{ steps.cra.outputs.vex }}
        run: |
          test "$EXIT_CODE" = "1"
          check() { node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if (!($2)) process.exit(1)" "$1"; }
          check "$SARIF" "d.version === '2.1.0'"
          check "$SBOM" "d.specVersion === '1.6'"
          check "$VEX" "Array.isArray(d.vulnerabilities)"
      # Any-language path: a CycloneDX SBOM with Log4Shell (CISA KEV) must fail.
      - uses: ./
        id: polyglot
        continue-on-error: true
        with:
          sbom-input: test/fixtures/sbom-input/bom.cdx.json
          sarif: polyglot.sarif
          upload-sarif: 'false'
          vex: polyglot-vex.cdx.json
      - name: Check the SBOM-input run
        env:
          EXIT_CODE: ${{ steps.polyglot.outputs.exit-code }}
          SARIF: ${{ steps.polyglot.outputs.sarif }}
          VEX: ${{ steps.polyglot.outputs.vex }}
        run: |
          test "$EXIT_CODE" = "1"
          node -e "
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const vex = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const kev = sarif.runs[0].results.some((r) => r.message.text.includes('CISA KEV') && r.message.text.includes('log4j-core'));
            const log4shell = vex.vulnerabilities.some((v) => v.id === 'CVE-2021-44228');
            if (!kev || !log4shell) process.exit(1);
          " "$SARIF" "$VEX"
