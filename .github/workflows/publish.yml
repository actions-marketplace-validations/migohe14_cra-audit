name: Publish to npm

# Runs when a version tag is pushed (`npm version <x> && git push --follow-tags`).
# Publishes with npm Trusted Publishing (OIDC): no NPM_TOKEN secret, and every
# release carries a signed provenance attestation linking the tarball to this
# repository and commit. Then creates the GitHub Release from CHANGELOG.md.
#
# One-time setup on npmjs.com: package settings → "Trusted publishing" →
# GitHub Actions, repository migohe14/cra-audit, workflow publish.yml.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ${PKG_VERSION}"
            exit 1
          fi

      # Fails before publishing when the changelog has no section for this version.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADING=$(grep -m1 -E "^## \[${VERSION//./\\.}\]" CHANGELOG.md || true)
          if [ -z "$HEADING" ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          awk -v heading="$HEADING" '
            $0 == heading { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          SUBTITLE=$(echo "$HEADING" | sed -E 's/^## \[[^]]*\][[:space:]]*(—[[:space:]]*)?//')
          echo "RELEASE_TITLE=${GITHUB_REF_NAME}${SUBTITLE:+ — $SUBTITLE}" >> "$GITHUB_ENV"
          cat >> release-notes.md <<'EOF'

          ## Supply chain

          Published from GitHub Actions with npm provenance via Trusted Publishing.
          EOF

      - run: npm test
      - run: npm publish --provenance --access public

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "$RELEASE_TITLE" --notes-file release-notes.md
